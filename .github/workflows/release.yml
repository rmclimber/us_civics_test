name: Build and release Windows app

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Validate question bank
        working-directory: backend
        run: go test ./... -run TestEmbeddedQuestionBank
      - name: Test application
        working-directory: backend
        run: go test ./...
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Build Windows executable
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ../release -Force | Out-Null
          go build -trimpath -ldflags="-s -w" -o ../release/USCivicsPractice.exe .
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md release/README.txt
          $version = '${{ github.ref_name }}'
          if ($version -notmatch '^v') { $version = 'v1.0.0' }
          Compress-Archive -Path release/USCivicsPractice.exe,release/README.txt -DestinationPath "release/CivicsPractice-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CivicsPractice-windows-x64
          path: release/CivicsPractice-*-windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/CivicsPractice-*-windows-x64.zip
